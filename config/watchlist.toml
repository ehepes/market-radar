# Market Radar — watchlist
#
# WHY EACH ENTRY HAS TWO SYMBOLS
# ------------------------------
# signal_symbol = where the price data comes from.
# trade_ticker / trade_isin = what you can actually buy in Revolut Ireland.
#
# These differ for index funds, for two independent reasons:
#
#   1. Revolut Ireland is served by Revolut Securities Europe UAB. EEA retail
#      investors cannot buy US-domiciled ETFs (SPY, QQQ, VOO) at all, because
#      those funds do not publish a PRIIPs KID. You buy the EU-listed UCITS
#      equivalent instead.
#   2. Free market data covers US-listed symbols well and EU venues badly.
#      Twelve Data's free tier is US equities, ETFs, forex and crypto only;
#      Xetra and Euronext need a $79/month plan.
#
# So the engine measures the liquid US-listed proxy and tells you the UCITS
# instrument to buy. Both track the same index, so trend and momentum signals
# carry over. What does NOT carry over is currency: a EUR-denominated share
# class of a USD index also moves with EUR/USD. The eurusd entry below tracks
# that separately.
#
# Individual US-listed shares need no proxy — Revolut offers 1,500+ of them
# directly, so signal_symbol and trade_ticker are the same.
#
# ALWAYS verify availability in the Revolut app by ISIN before trading. ISINs
# here are the standard UCITS equivalents, not a confirmation that your
# account tier can buy them today.

# =============================================================== core index

[[instrument]]
id = "sp500"
name = "S&P 500"
asset_class = "etf"
signal_symbol = "SPY"
trade_ticker = "SXR8"
trade_isin = "IE00B5BMR087"
trade_venue = "Xetra"
trade_currency = "EUR"
trade_note = "iShares Core S&P 500 UCITS ETF (Acc). Also listed as CSPX. US-listed SPY is not available to EEA retail."
rules = ["trend_regime", "pullback_to_50", "oversold_dip", "correction_10pct", "drawdown_20pct", "big_move_1d", "vol_regime_shift", "near_52w_high"]

