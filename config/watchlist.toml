# symbols but not a whole watchlist. Suffixes: .LON .DEX .PAR .AMS .MIL .MAD

[[instrument]]
id = "sxr8_direct"
name = "iShares Core S&P 500 (Xetra line)"
asset_class = "etf"
signal_symbol = "SXR8.DEX"
signal_provider = "alphavantage"
enabled = false
trade_ticker = "SXR8"
trade_isin = "IE00B5BMR087"
trade_venue = "Xetra"
trade_currency = "EUR"
trade_note = "The actual EUR line, rather than the SPY proxy. Use this to sanity-check that the proxy tracks what you are buying."
