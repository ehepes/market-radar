name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor (tomllib); 3.12 is what the radar workflow uses.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Self-test
        run: python3 -m radar selftest

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate shipped config
        run: python3 -m radar check

      - name: Byte-compile every module
        run: python3 -m compileall -q radar
