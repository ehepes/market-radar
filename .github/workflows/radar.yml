name: Market Radar

# Times are UTC. GitHub's scheduler is best-effort and can run late under
# load, which is fine for a days-to-weeks horizon but is the reason this is
# not an intraday tool.
on:
  schedule:
    # Weekday morning in Ireland, before the European open.
    - cron: "30 7 * * 1-5"
    # Midday, after Europe has been trading for a few hours.
    - cron: "0 12 * * 1-5"
    # After the US close (21:00 UTC in winter, 20:00 in summer), so the
    # daily bar is final.
    - cron: "45 21 * * 1-5"
    # Weekends: crypto only, since it never closes.
    - cron: "0 10 * * 6,0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and publish, but send no push alerts"
        type: boolean
        default: false
      force:
        description: "Ignore alert cooldowns (re-send everything currently true)"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs race on the committed state database.
concurrency:
  group: market-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The engine has zero third-party dependencies, so there is nothing to
      # install and nothing that can break from a bad upstream release.

      - name: Self-test (offline, no network or keys)
        run: python3 -m radar selftest

      - name: Validate configuration
        run: python3 -m radar check
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}

      - name: Run the radar
        run: |
          python3 -m radar run \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_DASHBOARD_URL: ${{ vars.RADAR_DASHBOARD_URL }}
          RADAR_PORTFOLIO_TOML: ${{ secrets.RADAR_PORTFOLIO_TOML }}

      - name: Commit dashboard data and state
        run: |
          git config user.name  "market-radar[bot]"
          git config user.email "market-radar@users.noreply.github.com"
          git add docs/data.json
          if [ -f state/radar.db ]; then git add -f state/radar.db; fi
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "radar: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another scheduled run may have pushed while this one was working.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"
